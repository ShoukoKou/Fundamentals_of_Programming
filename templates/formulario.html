<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Solicitud de Certificado</title>
</head>
<body>
  <h1>Solicitud de Certificado</h1>

  {% if error %}
    <p>{{ error }}</p>
  {% endif %}

  <form action="{{ url_for('index') }}" method="POST">
    <label for="tipo">Tipo de certificado:</label><br>
    <select id="tipo" name="tipo" required>
      <option value="">Selecciona</option>
      <option value="Estudios">Estudios</option>
      <option value="Conducta">Conducta</option>
      <option value="Otro">Otro</option>
    </select><br><br>

    <label for="motivo">Motivo:</label><br>
    <textarea id="motivo" name="motivo" rows="4" required></textarea><br><br>

    <label for="correo">Correo electrónico:</label><br>
    <input type="email" id="correo" name="correo" required><br><br>

    <label for="telefono">Teléfono (9 dígitos):</label><br>
    <input type="tel" id="telefono" name="telefono"
           pattern="[0-9]{9}"
           title="Ingresa exactamente 9 dígitos numéricos"
           required><br><br>

    <label for="fecha_entrega">Fecha estimada de entrega:</label><br>
    <input type="date" id="fecha_entrega" name="fecha_entrega" required><br><br>

    <button type="submit">Enviar solicitud</button>
  </form>

  <p><a href="{{ url_for('reporte') }}">Ver reporte de solicitudes</a></p>
</body>
</html>
